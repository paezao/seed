#cloud-config
# Paste as "user data" when creating an Ubuntu or Debian server (Hetzner,
# DigitalOcean, AWS…): it puts a Seed on it, with HTTPS. Fill in the key
# (and a domain, or leave it empty for <server IP>.sslip.io). See docs/vps.md.
runcmd:
  # The log holds your new password: keep it root-only.
  - >-
    umask 077; curl -fsSL https://raw.githubusercontent.com/paezao/seed/main/deploy/vps/setup.sh
    | OPENROUTER_API_KEY='sk-or-REPLACE-ME' SEED_DOMAIN='' SEED_NAME='seed'
    sh > /var/log/seed-setup.log 2>&1
