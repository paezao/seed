# Releases Seed: a signed kernel (for Seeds' updates), the seed CLI for Linux
# and macOS (for install.sh), and, once published, the hosting image.
#
#   1. Actions → release → Run workflow (or push a tag v2026.10.20).
#   2. The same checks as CI run, plus the boot smoke test.
#   3. Signing waits for approval (the "release" environment), then a DRAFT
#      release is made. Seeds don't see drafts.
#   4. Review the notes (they're what Seeds show in their update banner) and
#      press Publish. That makes it the latest release; Seeds pick it up,
#      and the image workflow pushes ghcr.io/paezao/seed.
#
# See docs/releasing.md.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (empty: today, e.g. 2026.10.20, with .2, .3… if taken)'
        required: false
      notes:
        description: "What's new, shown in Seeds' update banner (empty: the commits since the last release)"
        required: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    # The signing key lives in this environment, which needs approval.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Version and notes
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
          HAS_KEY: ${{ secrets.SEED_RELEASE_KEY != '' }}
        run: |
          set -euo pipefail
          # Before anything is tagged: without the key there can be no release.
          if [ "$HAS_KEY" != "true" ]; then echo "::error::Add the SEED_RELEASE_KEY secret to the release environment first (see docs/releasing.md)"; exit 1; fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          else
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::Release from main (this run is on $GITHUB_REF_NAME)"; exit 1
            fi
            version="${INPUT_VERSION#v}"
            if [ -z "$version" ]; then
              version="$(date -u +%Y.%m.%d)"
              n=2; base="$version"
              while git rev-parse -q --verify "refs/tags/v$version" >/dev/null; do version="$base.$n"; n=$((n+1)); done
            fi
            if ! printf '%s' "$version" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'; then
              echo "::error::Version must look like 2026.10.20 (or 2026.10.20.2)"; exit 1
            fi
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "::error::v$version already exists"; exit 1
            fi
            if [ -n "$INPUT_NOTES" ]; then
              printf '%s\n' "$INPUT_NOTES" > notes.md
            else
              prev="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
              range="${prev:+$prev..}HEAD"
              { echo "Changes${prev:+ since $prev}:"; echo; git log --no-merges --pretty='- %s' "$range" | head -50; } > notes.md
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"; cat notes.md

      - name: Tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -F notes.md
          git push origin "v$VERSION"

      - name: Build the template
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: make template VERSION="$VERSION"

      - name: Sign
        env:
          SEED_RELEASE_KEY: ${{ secrets.SEED_RELEASE_KEY }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          go run ./cmd/seed release sign --template kernel/template/assets/template.tar.gz \
            --dockerfile Dockerfile --version "$VERSION" --notes notes.md --out dist

      - name: Build the CLI (with this release's template inside)
        run: |
          set -euo pipefail
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${t%/*}"; arch="${t#*/}"; d="$(mktemp -d)"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$d/seed" ./cmd/seed
            cp LICENSE "$d/"
            tar -C "$d" -czf "dist/seed_${os}_${arch}.tar.gz" seed LICENSE
          done
          (cd dist && sha256sum seed_*.tar.gz > checksums.txt)

      - name: Attest where the files came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* --draft --title "Seed $VERSION" --notes-file notes.md --verify-tag
          {
            echo "### v$VERSION is drafted"
            echo
            echo "Review the notes (Seeds show them in their update banner), then **Publish**:"
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"
          } >> "$GITHUB_STEP_SUMMARY"
