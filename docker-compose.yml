# Shared local infrastructure for Seeds. `seed run` starts the same thing
# automatically (seed infra up) with a random superuser password kept in
# ~/.config/seed/postgres.json. If you prefer compose, set SEED_POSTGRES_PASSWORD
# and point Seeds at it with SEED_DATABASE_URL.
name: seed-infra
services:
  postgres:
    image: postgres:17
    container_name: seed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seed
      POSTGRES_PASSWORD: ${SEED_POSTGRES_PASSWORD:?set SEED_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - seed-postgres-data:/var/lib/postgresql/data
    networks: [seed-net]
volumes:
  seed-postgres-data:
    name: seed-postgres-data
networks:
  seed-net:
    name: seed-net
