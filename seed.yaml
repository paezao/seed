# Seed configuration. Part of the kernel: changing it requires owner approval.
name: seed

server:
  addr: 127.0.0.1:8080

model:
  # Which model I think with is chosen by my owner in my control plane
  # (stored outside this repository). This only bounds each response.
  max_tokens: 16000

database:
  # Empty: use the managed local PostgreSQL (started automatically; its random
  # superuser password lives in ~/.config/seed/postgres.json). Set a URL, or
  # SEED_DATABASE_URL, to use your own server.
  url: ""

sandbox:
  driver: docker      # docker (isolated) | local (no isolation; tests only)
  image: seed-sandbox # built from ./Dockerfile
  network: seed-net
  db_host: seed-postgres:5432
  memory: 4g
  cpus: "4"

organism:
  build: make -C organism build
  test: make -C organism test
  run: organism/bin/server
  port: 8080
  health: /healthz
  migrations: organism/migrations

evolution:
  max_repair_attempts: 3
  max_agent_turns: 150
  command_timeout_seconds: 900

permissions:
  # allow | ask | deny for each risk level.
  safe: allow         # reading, inspecting, running tests
  review: allow       # changing the organism, migrations, dependencies (inside the sandbox)
  dangerous: ask      # changing the kernel
  require_plan_approval: false
  require_apply_approval: false

kernel:
  # Only these directories evolve freely. Everything else (kernel/, cmd/,
  # control/, this file, go.mod, root files, and anything new at the root) is
  # the kernel: read-only in sandboxes, and changing it needs owner approval.
  evolvable:
    - organism/
    - knowledge/
    - skills/
